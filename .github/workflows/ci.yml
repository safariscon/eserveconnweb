name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Check Docker image build
        run: docker build -t eserveconn-web:${{ github.sha }} .

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_NAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "Dockerfile,.dockerignore,docker-compose.yml,package.json,package-lock.json,index.html,vite.config.js,server,src,public"
          target: "/tmp/eserveconn-web"
          rm: true

      - name: Build and run Docker image on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          SERVER_NAME: ${{ secrets.SERVER_NAME }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_NAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: SERVER_NAME,CONTACT_TO,MAIL_FROM,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASS
          script: |
            set -e
            cd /tmp/eserveconn-web
            docker build -t eserveconn-web:latest .
            docker rm -f eserveconn-web || true
            docker run -d \
              --name eserveconn-web \
              --restart unless-stopped \
              -p 4174:4174 \
              -e PORT=4174 \
              -e SERVER_NAME="$SERVER_NAME" \
              -e CONTACT_TO="$CONTACT_TO" \
              -e MAIL_FROM="$MAIL_FROM" \
              -e SMTP_HOST="$SMTP_HOST" \
              -e SMTP_PORT="$SMTP_PORT" \
              -e SMTP_SECURE="$SMTP_SECURE" \
              -e SMTP_USER="$SMTP_USER" \
              -e SMTP_PASS="$SMTP_PASS" \
              eserveconn-web:latest
